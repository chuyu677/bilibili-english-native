<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BiliNative Settings</title>
  <style>
    body {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #eef1f6;
      line-height: 1.5;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #fb7299, #00a1d6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #939bb0;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .card {
      background: #171a23;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .preset-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #212634;
      color: #eef1f6;
      font-size: 12px;
      cursor: pointer;
    }
    .preset-btn:hover {
      border-color: #fb7299;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0f1117;
      color: #eef1f6;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    button.primary {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #fb7299;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: #212634;
      color: #eef1f6;
      font-weight: 600;
      cursor: pointer;
    }
    #status {
      margin-top: 14px;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }
    #status.ok {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    #status.err {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <h1>BiliNative — Model & API Settings</h1>
  <div class="subtitle">Connect Bilibili's open-source <b>Index-Translate</b> model locally or any OpenAI-compatible LLM.</div>

  <div class="card">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Quick Presets</div>
    <div class="presets">
      <button class="preset-btn" data-preset="bilibili-public">Bilibili Free Public API (35B-A3B)</button>
      <button class="preset-btn" data-preset="index-9b">Local Index-Translate-9B (vLLM)</button>
      <button class="preset-btn" data-preset="index-2b">Local Index-Translate-2B (vLLM)</button>
      <button class="preset-btn" data-preset="ollama">Local Ollama</button>
      <button class="preset-btn" data-preset="deepseek">DeepSeek API</button>
      <button class="preset-btn" data-preset="openai">OpenAI (gpt-4o-mini)</button>
    </div>

    <label for="apiUrl">API Endpoint (OpenAI-compatible Chat Completions URL)</label>
    <input type="text" id="apiUrl" placeholder="https://index-translate.bilibili.com/v1/chat/completions" />

    <label for="model">Model Name</label>
    <input type="text" id="model" placeholder="Index-Translate-35B-A3B" />

    <label for="apiKey">API Key (leave blank for local vLLM / Ollama)</label>
    <input type="password" id="apiKey" placeholder="sk-..." />

    <label for="promptMode">Prompt Mode</label>
    <select id="promptMode">
      <option value="general-llm">Natural YouTube/Bilibili Slang Mode (Batch JSON — Best for LLMs)</option>
      <option value="index-translate">Index-Translate Direct Mode (Best for Index-Translate models)</option>
    </select>

    <label for="batchSize">Batch Size (1–20)</label>
    <input type="number" id="batchSize" min="1" max="20" value="8" />

    <div class="actions">
      <button class="primary" id="saveBtn">Save Settings</button>
      <button class="secondary" id="testBtn">Test Connection</button>
      <button class="secondary" id="clearCacheBtn">Clear Cache</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
