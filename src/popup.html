<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BiliNative</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #14161c;
      color: #eef1f6;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #fb7299, #00a1d6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }
    .row:last-of-type {
      border-bottom: none;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #fb7299;
      cursor: pointer;
    }
    .footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: #232733;
      color: #eef1f6;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #2e3444;
    }
    .meta {
      margin-top: 10px;
      font-size: 11px;
      color: #939bb0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">BiliNative</div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;">
      <span>Active</span>
      <input type="checkbox" id="enabled" />
    </label>
  </div>

  <div class="row">
    <span>UI Labels (Home, Like, etc.)</span>
    <input type="checkbox" id="translateUI" />
  </div>
  <div class="row">
    <span>Video Titles</span>
    <input type="checkbox" id="translateTitles" />
  </div>
  <div class="row">
    <span>UP Posts & Descriptions</span>
    <input type="checkbox" id="translatePosts" />
  </div>
  <div class="row">
    <span>Comments & Replies</span>
    <input type="checkbox" id="translateComments" />
  </div>
  <div class="row">
    <span>Hover to Peek Chinese</span>
    <input type="checkbox" id="hoverOriginal" />
  </div>

  <div class="footer">
    <button id="openOptions">Model & API Settings</button>
  </div>
  <div class="meta" id="cacheStats">Cached translations: —</div>

  <script src="popup.js"></script>
</body>
</html>
